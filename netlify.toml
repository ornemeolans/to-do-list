# Netlify: publica SOLO los archivos de la app (no tests, scripts,
# package.json ni assets sin uso).
[build]
  command = "rm -rf _site && mkdir _site && cp -r index.html sw.js manifest.webmanifest css js icons _site/"
  publish = "_site"

# El service worker nunca se cachea: así cada deploy llega a los usuarios.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Cabeceras de seguridad básicas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
