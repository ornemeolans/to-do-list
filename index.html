<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas Aesthetic</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Versión fijada (antes: @latest, que puede romper la app sin aviso
         ante un cambio breaking de la librería). Pendiente: agregar el
         atributo integrity (SRI) — ver README, sección "Seguridad". -->
    <script src="https://unpkg.com/lucide@1.30.0/dist/umd/lucide.min.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="suggestions-column">
            <h2>Sugerencias ✨</h2>
            <ul id="suggestions-list"></ul>
        </aside>

        <main class="lists-column">
            <div class="header-main">
                <h1>Mis Listas</h1>
                <button id="dark-toggle" class="icon-btn" title="Cambiar Tema">🌙</button>
            </div>
            <div class="input-container">
                <input type="text" id="new-list-input" placeholder="Nombre de la nueva lista...">
                <button id="add-list-btn">Crear Lista</button>
            </div>
            <div id="lists-container"></div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>

    <div id="template-modal" class="modal-root" style="display: none;"></div>
    <div id="focus-overlay" class="focus-overlay" style="display: none;"></div>
</body>
</html>
