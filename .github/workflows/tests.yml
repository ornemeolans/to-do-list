name: Tests

# El deploy lo hace Netlify automáticamente con cada push a main
# (configuración en netlify.toml). Este workflow verifica la calidad.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios (estado + sincronización)
        run: npm test
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests end-to-end (escritorio + móvil + offline)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
